# 重新生成时的"定向强化句"
#
# ## 为什么需要它
#
# 生成不满意时，重画一次只是**换一个随机种子再抽一次** —— 模型不知道你为什么不满意。
# 这里把"为什么不满意"翻成一段明确的强化要求，接在正向提示词后面。
#
# 两类用法：
# - `manual: true`（7 条）：**用户在界面上选**。每次重画都要花 1 次额度，
#   所以让用户把方向说清楚，价值很高。选项刻意只给"能落到具体要求上"的，
#   不给"其他"输入框 —— 自由文本容易被写成"不好看"，对模型没有信息量。
# - `manual: false`（3 条）：**系统自动判出来后自己用**（质检的确定性闸门给的失败原因）。
#
# ⚠️ 每一条都是"明确、可执行、不与风格约束打架"的句子。改的时候守住这一点：
# 强化句越具体越有效，越笼统越等于没说（甚至会把画面带跑）。
version: 1

items:
  # ---------------- 用户可选（界面上给选项） ----------------
  color:
    manual: true
    label: 配色不对
    text: |
      【本次重点修正】上一版的配色与原鞋不符。这一版必须严格按原鞋照片取色：
      保留主色、辅色、点缀色，以及它们在鞋身上的位置关系；
      不要整体褪成灰色调、不要换成别的颜色、不要自创原鞋上没有的色块。
      可以适度降低饱和度（水彩本就柔和），但**红要还是红、蓝要还是蓝**。

  shape:
    manual: true
    label: 鞋型不太像
    text: |
      【本次重点修正】上一版的鞋型与原鞋不符。这一版必须严格忠于原鞋的轮廓与比例：
      鞋长、鞋高、鞋底厚度、鞋头形态、鞋帮高度都要一致；
      不得压扁、拉长、胖化或改变鞋头形状，不得增删部件、不得把鞋子画成局部特写。

  detail:
    manual: true
    label: 细节丢太多
    text: |
      【本次重点修正】上一版丢掉了太多原鞋的结构细节。这一版要把它们画回来：
      鞋面主要拼接关系、鞋底关键结构、标志性设计元素、关键遮挡关系。
      注意分寸：**结构和色块要还原，缝线/网布/微小孔洞这类材质级细节仍可简化**。

  painterly:
    manual: true
    label: 太像线稿、笔触太硬
    text: |
      【本次重点修正】上一版太像"线稿加填色"，不像手绘水彩。这一版要更像水彩：
      不要用粗黑勾线去定义整双鞋，鞋的形态由水彩色块、明暗与局部边缘共同构成；
      加强透明叠色、颜料浓淡变化、水迹与少量晕染，边缘保留自然的不规则感，
      不要过硬、过干净的数字绘画边界。

  clean:
    manual: true
    label: 画面太脏
    text: |
      【本次重点修正】上一版画面偏乱。这一版要更干净：去掉多余的线条与杂色块，
      颜料飞溅要克制、不得抢过鞋子主体，避免色块糊成一团。
      画面应当清爽、主体明确。

  lighter:
    manual: true
    label: 太黑、太重
    text: |
      【本次重点修正】上一版整体偏重、偏黑。这一版要更轻：
      降低颜料的浓度与覆盖，浅色部位要留住留白；不要用深色压满鞋面或鞋底；
      深色只出现在原鞋本来就深的位置，并且保留层次（炭黑/墨灰/深灰），不要糊成一块死黑。

  denser:
    manual: true
    label: 太淡、太空
    text: |
      【本次重点修正】上一版整体偏淡偏空，像没画完。这一版要更实：
      加强关键结构的明暗与色块，让鞋面分区、鞋底体积、标志性元素都立起来；
      不要画成一整片空白或极淡的灰。

  # ---------------- 系统自动用（质检判出来的原因） ----------------
  underfilled:
    manual: false
    text: |
      【本次重点修正】上一版画得太轻：整张画稿几乎只有线条，**一块实色都没有**。
      这一版必须把品牌标志性图形（钩形/飞人/三道杠/交叉条纹）用实心画出来 ——
      **同色系的标识也要画**；但不要在鞋头、前掌、鞋面、中底上额外加黑块。

  overfilled:
    manual: false
    text: |
      【本次重点修正】上一版**涂得太重了**：鞋头/中底/鞋面被大块实色盖住，画面被压死了。
      这一版只保留必要的实色块 —— 品牌标志性图形；鞋头、前掌、鞋面、中底、鞋底回到线描与浅色，
      **浅色或彩色的部位一律不得涂重**。

  silhouette:
    manual: false
    text: |
      【本次重点修正】上一版的鞋型与原鞋不符：外轮廓有缺失或走形。
      这一版必须严格按第 2 张参考图**逐段描摹外轮廓**，一段都不能省 ——
      尤其是鞋头与前掌那段；不得改变鞋型、不得增删部件、不得把鞋子画成局部特写。
