# 风格模板：手绘水彩（2026-09-24 新增，实验阶段）
#
# ## 这是什么
# 把用户上传的真实鞋款照片，转译成一张"手绘水彩鞋款插画"：保持鞋型与配色的高识别度，
# 同时明显看得出被画过（水彩纸、叠色、晕染、飞溅），不做商品摄影级写实。
#
# ## 与黑白线稿的关键区别（决定了这层配置为什么长这样）
#
# | | 黑白线稿 | 水彩 |
# |---|---|---|
# | 色彩空间 | 纯二值 | 连续色调 + 颜色 |
# | 后处理 | **必须二值化** | **绝不能二值化**（否则颜色被抹平） |
# | 结构参考图 | 要（白底黑线骨架，等效 ControlNet） | **不要**（骨架就是一套黑线，喂进去就会勾线） |
# | 填 Logo | 纯黑实心（"该不该填"是个二值决策，模型做不稳） | 按原鞋配色还原（不存在这个问题） |
# | 可量化性 | 高（墨量/线宽/排布） | 低（"像不像水彩"难量化，见下） |
#
# ## ⚠️ 实验状态（重要，别当成成品）
#
# 这是**能力探测**阶段的配置，专门用来回答"Seedream 能不能稳定出这种水彩"：
# - `min_score: 0.0` + 硬闸门只留画布 → **每双鞋只生成一次，不自动重画**。
#   因为要测的是"第一枪有多准"，自动重画会把真实水平盖掉。
# - 没有配 `style_metrics` / `style_floor` / `style_hard_max`：黑白那套墨量、排线、
#   实心块指标对彩色画稿没有意义。**水彩的确定性指标（配色偏差、主体占比等）还没做。**
# - 判官提示词暂时沿用黑白那份（`verify_lineart.md`），它按黑白规则打分，
#   所以 `style_consistency` 这类分数**不可信**，仅记录、不参与判定。
#   正式上线前必须写一份水彩判官提示词。
#
# 参考素材：`·水彩风格图/`（9 张真机产出 + 提示词原文）。
# 实测共性（用来定背景与留白）：纸色稳定为 **RGB(250,246,240)**，主体占比 0.30–0.47。
style_id: watercolor
name: 手绘水彩
version: 1

canvas:
  aspect_ratio: "3:2"
  view: lateral
  direction: toe_left
  padding: 8%
  background: paper # 暖白水彩纸（不是纯白）
  overlay_text: none

prompt:
  positive: |
    手绘水彩鞋款插画：透明水彩叠色（layered watercolor washes，透明颜料、可见的色层交叠、
    柔和的颜料浓淡变化），整体是"同一本球鞋水彩收藏册"里的一页。
    正侧面单只鞋，鞋头朝左，鞋子完整居中，画面大量留白。
    鞋型与比例必须忠实原鞋：鞋长、鞋高、鞋底厚度、鞋头形态、鞋帮高度、整体轮廓都不得改变；
    保留关键结构：品牌 Logo 的位置/大小/方向、鞋面主要拼接关系、鞋底关键结构、
    标志性设计元素、关键遮挡关系。
    配色必须参考原鞋照片的真实配色：保留主色、辅色、点缀色，以及它们在鞋身上的空间位置关系；
    整体适度降低饱和度与浓度，但"柔化颜色，不消除颜色性格" —— 红仍然是红、蓝仍然是蓝、橙仍然是橙；
    优先保留 3–5 个最重要的颜色关系，不要因为原鞋配色复杂而让画面失控。
    纯黑鞋不要用单一实色黑铺满：用炭黑、墨灰、蓝灰、深灰等多个水彩层次表现，
    保留鞋面、Logo、中底、外底之间的明暗差别，避免整双鞋压成一个黑块。
    纯白鞋不要画成没有内容的空白：用暖灰、冷灰、蓝灰、米白、浅灰紫这类极浅水彩表现结构，
    靠留白保留"白鞋"的感觉，不要整体画成灰鞋。
    鞋的形态由水彩色块、明暗与局部边缘共同构成，**不要用粗黑勾线去定义整双鞋**，
    也不要形成"线稿 + 上色"的观感。
    水彩质感：纸张纹理、颜料浓淡变化、水迹、少量晕染、略微不规则的边缘、局部颜料堆积、
    少量手绘的不完美；不要用过硬过干净的数字绘画边界。
    背景：暖白 / 米白水彩纸，带轻微纸张纹理；鞋子下方可以有一层很轻的水彩阴影；
    周围允许少量颜料飞溅与晕染，飞溅颜色适度呼应鞋款主色；背景元素必须克制，不抢主体。
    写实程度：中等偏高的鞋型还原 + 中等程度的绘画抽象；不追求商品摄影级光影、真实反射、
    皮革高光、塑料反光、超精细网布与缝线。
    可以简化：极细缝线、小面积网布纹理、复杂织物结构、微小孔洞、极小文字、技术标签、
    材质反光 —— 但**不得简化掉鞋款识别所依赖的结构、Logo 与主要色块分布**。
    核心标准：鞋要像，画不要太像照片。
  negative: |
    重新设计鞋款, 自创色块, 改变原鞋配色, 改变 Logo 位置, 改变 Logo 大小, 改变 Logo 方向,
    改动鞋底主结构, 改变鞋型, 卡通化, Q版, 夸张比例, 缩短鞋头, 刻意加厚鞋底, 胖化,
    商品摄影级光影, 真实反射, 皮革高光, 塑料反光, 金属反光, 3D 渲染, 赛璐璐平涂,
    马克笔渲染, 油画质感, 过度写实,
    粗黑勾线, 线稿加填色, 过硬的数字绘画边界, 死黑描边,
    多只鞋, 人物, 场景, 道具, 复杂背景, 水印, 文字水印, 画面内新增文字,
    荧光感, 数字高饱和, 灰阶, 素描, 排线

constraints:
  # 不要白底黑线的骨架参考图 —— 那会让模型去勾线（见文件头的对比表）
  structure_control: none
  logo_fidelity: high

provider_params:
  size: "1536x1024"
  aspect_ratio: "3:2"
  seed: null

postprocess:
  # ⚠️ 关键：彩色画稿绝不能走二值化
  binarize: false
  canvas_background: "#faf6f0" # 实测纸色 RGB(250,246,240)
  min_background_ratio: 0.45 # 实测参考图背景占比 0.53–0.70，取 0.45 当闸门
  normalize_to_canvas: true

quality_gate:
  # 判官提示词按风格换 —— 黑白那份按"纯二值、Logo 纯黑实心"打分，
  # 拿它判水彩会把正确产出判成不合格（实测其 style_consistency 无参考价值）。
  judge_prompt: verify_watercolor.md
  checks: [shoe_silhouette_match, logo_legibility, style_consistency, noise_level, canvas_ratio]
  weights:
    # 与黑白不同：水彩里"风格与配色保眞"就是主要质量轴（黑白里主要轴是鞋型与 Logo），
    # 所以 style_consistency 提到 0.35。
    shoe_silhouette_match: 0.30
    logo_legibility: 0.20
    style_consistency: 0.35
    noise_level: 0.05
    canvas_ratio: 0.10
  hard_gate:
    # canvas_ratio 是确定性判定（尺寸/3:2/背景留白），必须满分。
    # 另外两条用视觉模型的分数兜底 —— 但阈值刻意放低：判官本身有波动，
    # 卡太紧会把正确产出误杀（黑白那次的教训：闸门过硬 → 白烧重画）。
    canvas_ratio: 1.0
    shoe_silhouette_match: 0.60
    logo_legibility: 0.60
  min_score: 0.82
  # ------------------------------------------------------------------
  # 确定性指标：只留**实测稳定**的两条（11 张真实水彩标定）
  #
  #   subject_ratio     实测 0.298–0.357（参考图 0.30–0.47）→ 区间放到 [0.15, 0.60]
  #   paper_luminance   实测 11 张全是 246.5（纸色极稳）→ 下限 200
  #
  # ⚠️ 配色保真度**没有**做成闸门，原因如实记着：
  #   我试过"色相直方图重叠度（hue_match）"，实测**不具区分度** ——
  #   11 张里分数最高的是 Stan Smith（0.84，一双白鞋），最低的是 KD12（0.02），
  #   而两张目视都是好的。根因：原鞋本身没颜色时（KD12 的彩色像素占比仅 0.001）
  #   色相直方图就是噪声；即使原鞋有颜色，同一批正确产出的取值也散在 0.20–0.78，
  #   没有任何阈值能分开好与坏。
  #   所以 `hue_match` / `sat_ratio` / `chromatic_ratio` **只记录、不判定**，
  #   配色保真交给判官（它本来就更擅长这件事），这是当前已知的弱点。
  # ------------------------------------------------------------------
  style_metrics:
    subject_ratio: [0.15, 0.60]
    paper_luminance: [200, 255]
  style_hard_keys: [subject_ratio, paper_luminance]
  # 轮廓重合度对彩色画稿同样有意义，且是确定性的，保留。
  # 0.70 沿用黑白那批的标定：正常产出 0.73–0.98，塌陷的 0.27。
  silhouette_floor: 0.70
