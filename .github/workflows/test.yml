name: tests

# 触发：每次推送 + 每个 PR 都跑。
on:
  push:
  pull_request:

# 最小权限：这个仓库是公开的，任何人都能 fork 并提 PR。
# 工作流只需要读取代码，所以显式收窄 GITHUB_TOKEN —— 不写的话拿到的是仓库默认权限，
# 对公开仓库来说没必要。顺带说明：本工作流**不引用任何 secret**（测试全离线）。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：310+ 项测试（全 mock、离线），外加两个冒烟脚本的自检
  # ---------------------------------------------------------------------------
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 第一层测试（全 mock，离线）
        run: python -m pytest -q

      - name: 冒烟脚本自检（无 Key 时必须如实报告“待验”，不得冒充通过）
        run: |
          python scripts/smoke_real.py --query "kd12" --report .smoke-CI.md || code=$?
          if [ "${code:-0}" != "2" ]; then
            echo "无 Key 时冒烟脚本必须以退出码 2 表示“待验”"; exit 1
          fi
          grep -q "待验" ../docs/.smoke-CI.md

      - name: V2 上传冒烟脚本自检（mock 干跑：链路能通，且绝不写成“通过”）
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (1500, 1000), "white")
          ImageDraw.Draw(img).ellipse((250, 350, 1250, 750), fill="#3344cc")
          img.save("/tmp/ci-shoe.png")
          PY
          python scripts/smoke_upload.py --image /tmp/ci-shoe.png --force-mock || code=$?
          if [ "${code:-0}" != "2" ]; then
            echo "mock 干跑必须以退出码 2 结束（表示“未验收”）"; exit 1
          fi
          grep -q "演示模式（未验收）" ../docs/smoke-report-demo.md

  # ---------------------------------------------------------------------------
  # 前端：门槛四连 —— lint / 类型检查 / 单测 / 生产构建
  #
  # 为什么要把 build 也放进来：`tsc --noEmit` 查不出 Next 的路由与构建期问题，
  # 而线上前端是 standalone 产物，构建不过就是部署不过 —— 这一条必须在 CI 里挡住。
  # 后端地址有本地默认值（next.config.ts），CI 不需要注入 BACKEND_URL。
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 这里必须用 22+，不能用 20：
      # 测试工具链要求更高的 Node —— `jsdom@30` 声明 `^22.22.2 || ^24.15.0 || >=26`，
      # `vitest@5` / `undici@8` 也要 22 以上。用 20 会在跑 vitest 时报
      # `webidl.util.markAsUncloneable is not a function`（本地实测踩过）。
      #
      # 这些都是 **devDependencies**，所以生产运行时仍是 veFaaS 的 node20（`next` 只要 >=20.9）；
      # 两者不冲突 —— 但 CI 的 Node 版本必须跟测试工具链对齐。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（按 lock 文件，保证可重现）
        run: npm ci

      - name: 代码规范
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build
